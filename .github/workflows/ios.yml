name: Build iOS (.ipa)

# Runs on a GitHub-hosted Mac. Trigger it from the Actions tab ("Run workflow") or by pushing to main.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build (unsigned)
        run: flutter build ios --release --no-codesign
      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr FoodEX-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FoodEX-unsigned-ipa
          path: FoodEX-unsigned.ipa
